resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth {
        set $auth_service "${AUTH_SERVICE_URL}";
        proxy_pass $auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1 {
        set $inventory_service "${INVENTORY_SERVICE_URL}";
        proxy_pass $inventory_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    locaset $inventory_service "${INVENTORY_SERVICE_URL}";
        proxy_pass $inventory_service
        proxy_pass http://inventory-service:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    locaset $transaction_service "${TRANSACTION_SERVICE_URL}";
        proxy_pass $transaction_service
        proxy_pass http://transaction-service:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    locaset $transaction_service "${TRANSACTION_SERVICE_URL}";
        proxy_pass $transaction_service
        proxy_pass http://transaction-service:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
set $transaction_service "${TRANSACTION_SERVICE_URL}";
        proxy_pass $transaction_service
    location /transactions {
        proxy_pass http://transaction-service:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
set $agentic_service "${AGENTIC_SERVICE_URL}";
        proxy_pass $agentic_service
    location /wallabot {
        proxy_pass http://agentic-service:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}