services:
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: backend/auth-service/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    disk:
      name: auth-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: AUTH_DATABASE_URL
        value: sqlite:////app/data/auth.db

  - type: web
    name: inventory-service
    runtime: docker
    plan: free
    dockerfilePath: backend/inventory-service/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    disk:
      name: inventory-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/inventory.db
      - key: INVENTORY_UPLOAD_DIR
        value: /app/data/uploads

  - type: web
    name: transaction-service
    runtime: docker
    plan: free
    dockerfilePath: backend/transaction-service/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    disk:
      name: transaction-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/transactions.db
      - key: TRANSACTION_DATABASE_URL
        value: sqlite:////app/data/transactions.db

  - type: web
    name: agentic-service
    runtime: docker
    plan: free
    dockerfilePath: backend/agentic-service/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: wallabot

  - type: web
    name: frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /