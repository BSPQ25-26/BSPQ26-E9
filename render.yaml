services:
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: backend/auth-service/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: AUTH_DATABASE_URL
        value: sqlite:////app/data/auth.db
      - key: TRANSACTION_SERVICE_URL
        fromService:
          name: transaction-service
          type: web
          property: hostURL

  - type: web
    name: inventory-service
    runtime: docker
    plan: free
    dockerfilePath: backend/inventory-service/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/inventory.db
      - key: INVENTORY_UPLOAD_DIR
        value: /app/data/uploads

  - type: web
    name: transaction-service
    runtime: docker
    plan: free
    dockerfilePath: backend/transaction-service/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/transactions.db
      - key: TRANSACTION_DATABASE_URL
        value: sqlite:////app/data/transactions.db

  - type: web
    name: agentic-service
    runtime: docker
    plan: free
    dockerfilePath: backend/agentic-service/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: wallabot

  - type: web
    name: frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          type: web
          property: host
      - key: INVENTORY_SERVICE_URL
        fromService:
          name: inventory-service
          type: web
          property: host
      - key: TRANSACTION_SERVICE_URL
        fromService:
          name: transaction-service
          type: web
          property: host
      - key: AGENTIC_SERVICE_URL
        fromService:
          name: agentic-service
          type: web
          property: host